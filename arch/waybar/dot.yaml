linux[whoami.distro^="Arch"]:
  installs:
    cmd: |
      # The repository build still sends legacy Hyprland workspace dispatches.
      # Track upstream until its Lua IPC compatibility fix is released.
      yay -S --noconfirm --needed waybar-git
      # FIXME: Service??
      # sudo systemctl enable --now waybar.service
    depends:
      - /arch/hyprland
      - /lib/pipewire
      - /tools/timerbar
  links:
    config.jsonc: ~/.config/waybar/config.jsonc
    style.css: ~/.config/waybar/style.css
