# Flags for the ChatGPT desktop app, read by /usr/lib/chatgpt/codex-launcher.
# One flag per line; blank lines and # comments are ignored.

# Store credentials in KWallet instead of Chromium's plaintext "basic" backend.
# Matches the --password-store=kwallet6 already set for claude-desktop.
--password-store=kwallet6

# Electron 42.3.0 is bundled, but OpenAI's build still lands on XWayland without
# this (verified with hyprctl clients: xwayland=true). Arch Wiki's "Wayland by
# default since Electron 38.2" does not hold for this app.
--ozone-platform-hint=auto
