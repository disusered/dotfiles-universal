linux[whoami.distro^="Arch"]:
  installs:
    cmd: |
      sudo pacman -S --noconfirm --needed remmina freerdp
    depends:
      - /arch/kwallet
  links:
    remmina.pref: ~/.config/remmina/remmina.pref
    aws-ec2.remmina: ~/.local/share/remmina/aws-ec2.remmina
    remmina.lua: ~/.config/hypr/conf.d/remmina.lua
