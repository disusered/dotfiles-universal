linux[whoami.distro^="Arch"]:
  installs:
    cmd: |
      if ! pacman -Qi steam &>/dev/null; then
        sudo locale-gen
      fi
      # gamemode group membership is only needed for privileged features such
      # as renicing/core parking; gamemode.ini deliberately enables neither.
      sudo pacman -S --noconfirm --needed ttf-liberation steam gamemode lib32-gamemode gamescope vulkan-intel lib32-vulkan-intel mangohud lib32-mangohud
    depends:
      - /arch/hyprland
      - /arch/game-controller
      - /lib/networkmanager/
      - /lib/avahi/
      - /lib/pipewire/
  links:
    steam.conf: ~/.config/hypr/conf.d/steam.conf
    steam_minimal.desktop: ~/.local/share/applications/steam_minimal.desktop
    gamemode.ini: ~/.config/gamemode.ini
    gaming-session.sh: ~/.local/bin/gaming-session
    gaming-session-co-located.tsv: ~/.config/gaming-session/profiles/co-located.tsv
