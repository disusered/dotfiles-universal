; SkyrimPrefs.ini — discrete-GPU tier (AMD / NVIDIA). Generated by
; ~/.local/bin/skyrim-configure-display before every launch, from a template
; in ~/.dotfiles/games/skyrim-special-edition/. The window size below is the
; focused monitor's, detected at launch.
;
; Editing this copy accomplishes nothing, and neither does changing these in
; the game's own settings menu: both are overwritten on the next launch. Edit
; the template in the dotfiles repo instead.
;
; Derived from the game's own High.ini preset, unmodified apart from the
; window keys. This tier has never been run — it was written on the Intel
; machine. Verify it on the discrete-GPU machine and adjust; Ultra.ini in the
; game directory is the next step up if there is headroom.

[General]
uLargeRefLODGridSize=9

[Display]
iSize W=@WIDTH@
iSize H=@HEIGHT@

; Borderless, not exclusive fullscreen: gamescope owns the actual fullscreen
; surface. Same rationale as Civilization VI — a Proton game that drives its
; own exclusive-fullscreen mode has to rebuild its swap chain on every focus
; change, and that is where they crash.
bFull Screen=0
bBorderless=1

iShadowMapResolution=2048
iNumFocusShadow=4
fShadowDistance=8000
bVolumetricLightingEnable=1
iVolumetricLightingQuality=1
bScreenSpaceReflectionEnabled=1
bSAOEnable=1
bUsePrecipitationOcclusion=1
bEnableImprovedSnow=1
bEnableProjecteUVDiffuseNormals=1
bToggleSparkles=1
bIBLFEnable=1
bUse64bitsHDRRenderTarget=0
fMeshLODLevel1FadeDist=999999
fMeshLODLevel2FadeDist=999999
bUseTAA=1
bFXAAEnabled=0

[Decals]
bDecals=1
bSkinnedDecals=1
uMaxDecals=1000
uMaxSkinDecals=100
iMaxDecalsPerFrame=100
iMaxSkinDecalsPerFrame=25

[ImageSpace]
bDoDepthOfField=1
bLensFlare=1

[LOD]
fLODFadeOutMultObjects=9
fLODFadeOutMultActors=9
fLODFadeOutMultItems=6

[Grass]
fGrassStartFadeDistance=7000

[TerrainManager]
fTreeLoadDistance=75000
fBlockLevel0Distance=35000
fBlockLevel1Distance=70000
fBlockMaximumDistance=250000
fSplitDistanceMult=1.5
