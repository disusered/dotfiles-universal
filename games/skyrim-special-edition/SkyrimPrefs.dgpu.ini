; SkyrimPrefs.ini — discrete-GPU tier (AMD / NVIDIA). Generated by
; ~/.local/bin/skyrim-configure-display before every launch, from a template
; in ~/.dotfiles/games/skyrim-special-edition/. The window size below is the
; focused monitor's, detected at launch.
;
; Editing this copy accomplishes nothing, and neither does changing these in
; the game's own settings menu: both are overwritten on the next launch. Edit
; the template in the dotfiles repo instead.
;
; Unused compatibility template retained from an earlier mistaken hardware
; model. This computer has only Intel Iris Xe, and the launch-time generator
; never selects this file.

[General]
uLargeRefLODGridSize=9
; restored from stock SkyrimPrefs.ini (see note above)
fLightingOutputColourClampPostSpec=1.0000
fLightingOutputColourClampPostEnv=1.0000
fLightingOutputColourClampPostLit=1.0000
iStoryManagerLoggingEvent=-1
bEnableStoryManagerLogging=0

[Display]
iSize W=@WIDTH@
iSize H=@HEIGHT@

; Borderless, not exclusive fullscreen: gamescope owns the actual fullscreen
; surface. Same rationale as Civilization VI — a Proton game that drives its
; own exclusive-fullscreen mode has to rebuild its swap chain on every focus
; change, and that is where they crash.
bFull Screen=0
bBorderless=1

iShadowMapResolution=2048
iNumFocusShadow=4
fShadowDistance=8000
bVolumetricLightingEnable=1
iVolumetricLightingQuality=1
bScreenSpaceReflectionEnabled=1
bSAOEnable=1
bUsePrecipitationOcclusion=1
bEnableImprovedSnow=1
bEnableProjecteUVDiffuseNormals=1
bToggleSparkles=1
bIBLFEnable=1
bUse64bitsHDRRenderTarget=0
fMeshLODLevel1FadeDist=999999
fMeshLODLevel2FadeDist=999999
bUseTAA=1
bFXAAEnabled=0

; Mouse. Stated explicitly because nothing else in the INI chain supplies it.
; Skyrim_Default.ini in the game directory has no [Controls] and no [Interface]
; section, and the stock SkyrimPrefs.ini that does — the copy Steam's
; installscript.vdf pulls out of <gamedir>/Skyrim/ — is precisely what the
; read-only lock at the end of skyrim-configure-display exists to block. This
; generated file is therefore a complete replacement, not an overlay: anything
; absent here is absent from the game.
;
; With these missing on first play (2026-08-07) the mouse was dead in game —
; camera would not turn, in-game menus had no pointer, keyboard worked, and only
; the Bethesda launcher, which never reads these files, still had a cursor.
;
; Values are stock, verbatim from <gamedir>/Skyrim/SkyrimPrefs.ini.
;
; The keys below are the rest of stock's [Display] block, which High.ini does
; not carry. fGamma is the notable one — screen brightness was running on an
; engine default. Deliberately NOT restored here: iMaxDecalsPerFrame and
; iMaxSkinDecalsPerFrame. Stock puts them in [Display], but the quality presets
; put them in [Decals] with tier-specific values, and this file follows the
; preset. High happens to agree with stock on the numbers; the igpu tier does
; not, so both templates keep the same rule.
fInteriorShadowDistance=3000.0000
ffocusShadowMapDoubleEveryXUnit=450.0000
fDynamicDOFBlurMultiplier=0.8000
fProjectedUVNormalDetailTilingScale=0.8000
fProjectedUVDiffuseNormalTilingScale=0.2000
bIndEnable=0
bSAO_CS_Enable=0
iSaveGameScreenShotHeighWSt=192
iSaveGameScreenShotWidthWS=320
iSaveGameScreenShotHeight=192
iSaveGameScreenShotWidth=256
iShadowMaskQuarter=4
fLightLODStartFade=3500.0000
fLeafAnimDampenDistEnd=4600.0000
fLeafAnimDampenDistStart=3600.0000
fTreesMidLODSwitchDist=9999999.0000
fMeshLODFadePercentDefault=1.2000
fMeshLODFadeBoundDefault=256.0000
fMeshLODLevel2FadeTreeDistance=2048.0000
fMeshLODLevel1FadeTreeDistance=2844.0000
fGamma=1.0000
iScreenShotIndex=0
bTreesReceiveShadows=1
bDrawLandShadows=0

[Interface]
fMouseCursorSpeed=1.0000
bDialogueSubtitles=1
bGeneralSubtitles=1
bShowCompass=1

[Controls]
fMouseHeadingSensitivity=0.0125
fGamepadHeadingSensitivity=0.6667
bAlwaysRunByDefault=1
bInvertYValues=0
bGamePadRumble=1

; ── The rest of the stock prefs ─────────────────────────────────────────
; Verbatim from <gamedir>/Skyrim/SkyrimPrefs.ini. None of these sections
; appear in Medium.ini or High.ini, so the quality presets these templates
; derive from never supplied them — and since the generated file is a
; replacement rather than an overlay, every key below was absent from the
; game. Same defect as the mouse block above; this closes the rest of it.
;
; bGamepadEnable is what prompted the audit — controller support was riding
; on an engine default. iDifficulty and the autosave keys were too.
;
; Invariant: this template is a superset of the stock prefs file. Diff the
; two key lists after any edit and expect nothing missing.

