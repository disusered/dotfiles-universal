; SkyrimPrefs.ini — integrated-GPU tier (Intel Iris Xe). Generated by
; ~/.local/bin/skyrim-configure-display before every launch, from a template
; in ~/.dotfiles/games/skyrim-special-edition/. The window size below is the
; focused monitor's, detected at launch.
;
; Editing this copy accomplishes nothing, and neither does changing these in
; the game's own settings menu: both are overwritten on the next launch. Edit
; the template in the dotfiles repo instead.
;
; Derived from the game's own Medium.ini preset, with the two settings that
; cost an Iris Xe the most cut: volumetric lighting (god rays) and screen
; space reflections. Shadow map resolution is halved to Low's 1024.

[General]
uLargeRefLODGridSize=7

[Display]
iSize W=@WIDTH@
iSize H=@HEIGHT@

; Borderless, not exclusive fullscreen: gamescope owns the actual fullscreen
; surface. Same rationale as Civilization VI — a Proton game that drives its
; own exclusive-fullscreen mode has to rebuild its swap chain on every focus
; change, and that is where they crash.
bFull Screen=0
bBorderless=1

iShadowMapResolution=1024
iNumFocusShadow=2
fShadowDistance=3000
bVolumetricLightingEnable=0
iVolumetricLightingQuality=0
bScreenSpaceReflectionEnabled=0
bSAOEnable=1
bUsePrecipitationOcclusion=1
bEnableImprovedSnow=1
bEnableProjecteUVDiffuseNormals=1
bToggleSparkles=1
bIBLFEnable=1
bUse64bitsHDRRenderTarget=0
fMeshLODLevel1FadeDist=6000
fMeshLODLevel2FadeDist=3000
bUseTAA=1
bFXAAEnabled=0

[Decals]
bDecals=1
bSkinnedDecals=1
uMaxDecals=100
uMaxSkinDecals=35
iMaxDecalsPerFrame=10
iMaxSkinDecalsPerFrame=3

[ImageSpace]
bDoDepthOfField=1
bLensFlare=1

[LOD]
fLODFadeOutMultObjects=7
fLODFadeOutMultActors=7
fLODFadeOutMultItems=3

[Grass]
fGrassStartFadeDistance=2300

[TerrainManager]
fTreeLoadDistance=75000
fBlockLevel0Distance=20000
fBlockLevel1Distance=32000
fBlockMaximumDistance=100000
fSplitDistanceMult=1.1
