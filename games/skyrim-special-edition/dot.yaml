linux[whoami.distro^="Arch"]:
  installs:
    cmd: |
      set -e

      # Resolve the library holding Skyrim SE — it is not on the same drive on
      # every machine, and the Proton prefix lives beside the install.
      LIB=$("$HOME/.dotfiles/games/lib/steam-find-app-path.sh" 489830)
      GAME_DIR="$LIB/steamapps/common/Skyrim Special Edition"

      # Force the Windows build through Proton. Skyrim SE has no native Linux
      # port, and leaving the mapping unset means whatever Steam's global
      # default happens to be that week.
      "$HOME/.dotfiles/games/lib/steam-set-compat-tool.sh" \
        489830 \
        proton_experimental \
        'The Elder Scrolls V: Skyrim Special Edition'

      # Wrap in ScopeBuddy. The per-AppID conf caps the frame rate at 60 (Havok
      # physics breaks above it) and regenerates the INIs for whichever monitor
      # and GPU this machine has.
      #
      # skyrim-skse-launch sits *inside* scb rather than replacing it, so
      # SCB_PRE_COMMAND (INI generation) and SCB_AUTO_RES (resolution
      # detection) keep working. It swaps SkyrimSE.exe for skse64_loader.exe
      # when the loader is present and passes the command straight through when
      # it is not, so this is safe to set before any mod is installed.
      #
      # Spell the shim's path in full. ScopeBuddy execs the game command with
      # `env`, which resolves a bare name against PATH — and Steam's launch
      # environment does not carry ~/.local/bin, so a bare `skyrim-skse-launch`
      # dies with "No such file or directory" before the game ever starts.
      # $HOME is expanded here, at install time, so the value written into
      # localconfig.vdf is absolute on whichever machine ran the install.
      "$HOME/.dotfiles/games/lib/steam-set-launch-options.sh" \
        489830 \
        "scb -- $HOME/.local/bin/skyrim-skse-launch %command%" \
        'The Elder Scrolls V: Skyrim Special Edition'

      # The game creates this on first run; the pre-launch hook writes into it
      # before that has necessarily happened.
      mkdir -p "$LIB/steamapps/compatdata/489830/pfx/drive_c/users/steamuser/Documents/My Games/Skyrim Special Edition"

      # Microsoft Visual C++ 2022 x64 runtime, into this game's prefix.
      #
      # Both SSE Engine Fixes and SSE Display Tweaks list it as an external
      # requirement. On Windows it is usually already there; under Proton it is
      # not, and without it those SKSE plugins fail to load and the game starts
      # as though no mods were installed. SKSE's log says only that the plugin
      # failed — it never mentions the runtime — so this is worth doing up front
      # rather than diagnosing later.
      if ! pacman -Qi protontricks &>/dev/null; then
        sudo pacman -S --noconfirm --needed protontricks
      fi

      PFX="$LIB/steamapps/compatdata/489830/pfx"
      if grep -qx 'vcrun2022' "$PFX/winetricks.log" 2>/dev/null; then
        echo "vcrun2022 already present in the Skyrim prefix"
      else
        # bwrap containment breaks on some sandboxed setups; fall back to it off.
        protontricks 489830 -q vcrun2022 \
          || protontricks --no-bwrap 489830 -q vcrun2022
      fi

      # Skip the Bethesda logo on every launch. Reversible with a single mv,
      # and Steam's verify-integrity puts it back.
      LOGO="$GAME_DIR/Data/Video/BGS_Logo.bik"
      if [ -f "$LOGO" ] && [ ! -f "$LOGO.bak" ]; then
        mv "$LOGO" "$LOGO.bak"
        echo "Intro video disabled (Data/Video/BGS_Logo.bik -> .bak)"
      fi
    depends:
      - /arch/steam
      - /tools/scopebuddy
  links:
    skyrim-configure-display.sh: ~/.local/bin/skyrim-configure-display
    skyrim-skse-launch.sh: ~/.local/bin/skyrim-skse-launch
    skyrim-install-mods.sh: ~/.local/bin/skyrim-install-mods
    scopebuddy.conf: ~/.config/scopebuddy/AppID/489830.conf
    skyrim.conf: ~/.config/hypr/conf.d/skyrim.conf
