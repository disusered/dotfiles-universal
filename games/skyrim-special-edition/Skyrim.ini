; Skyrim.ini — generated by ~/.local/bin/skyrim-configure-display before every
; launch, from a template in ~/.dotfiles/games/skyrim-special-edition/.
;
; The field of view below is computed from the detected aspect ratio. Editing
; this copy accomplishes nothing: it is overwritten on the next launch. Edit
; the template in the dotfiles repo instead.
;
; SkyrimSE.exe loads Skyrim_default.ini from the game directory as its base
; (verified against the INI chain in the 1.6.1170 binary), so this file only
; carries overrides.

[General]
; Keep simulating while the gamescope surface is unfocused. On the
; dual-monitor machine that means moving to the other screen does not freeze
; the game or cut its audio.
bAlwaysActive=1

[Display]
; Vanilla is 80 at 16:9. Wider displays get a Hor+ widened value so the extra
; screen shows more world instead of stretching it. Both keys are set together,
; which is what the `fov` console command does — changing only the world FOV
; leaves the first-person weapon model at 65 and it visibly clips.
fDefaultWorldFOV=@FOV@
fDefault1stPersonFOV=@FOV@
