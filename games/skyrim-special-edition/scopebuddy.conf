# Skyrim Special Edition (AppID 489830)

# Skyrim's Havok physics is stepped off the frame rate. Above roughly 60 fps
# it produces objects that drift or launch themselves, carts and ladders that
# break, and water that flows at the wrong speed. Every monitor this repo
# serves runs faster than 60 (75 Hz at work, 144 Hz at home), and the mod that
# properly decouples physics — SSE Display Tweaks — is deliberately not
# installed yet. So the cap is a correctness requirement, not a preference.
#
# DXVK is the authoritative cap: it holds even if the gamescope wrapper is
# ever dropped, the way Prince of Persia dropped it. This DXVK build exposes
# the inline DXVK_CONFIG form; it has no DXVK_FRAME_RATE variable.
export DXVK_CONFIG="dxvk.maxFrameRate = 60"

# Pace the nested compositor at 60 as well, so gamescope is not presenting a
# 60 fps stream on a 75 or 144 Hz cadence.
#
# --force-windows-fullscreen keeps the game's borderless window filling the
# nested surface; --force-grab-cursor stops the pointer escaping onto the
# second monitor mid-swing.
SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS -r 60 --force-grab-cursor --force-windows-fullscreen"

# Regenerate the INIs for this machine's monitor and GPU before launching.
# WIDTH and HEIGHT are populated later by ScopeBuddy's SCB_AUTO_RES pass, so
# keep this single-quoted — it has to expand when the hook runs, not now.
# shellcheck disable=SC2016,SC2034
SCB_PRE_COMMAND='"$HOME/.local/bin/skyrim-configure-display" "$WIDTH" "$HEIGHT"'

# ── Tuning knobs, both off by default ────────────────────────────────────────
#
# Both knobs shrink gamescope's *nested* resolution. The pre-command above
# would still size the game to the full panel, so the game would keep
# rendering at native and the knob would buy nothing. Whenever you enable one,
# override SCB_PRE_COMMAND with the same internal size, as shown.
#
# ── FSR upscaling ──
# Render below native and let gamescope upscale with FSR. This is the lever to
# reach for if the Iris Xe machine cannot hold 60 outdoors — it buys back a lot
# of frames for a modest softness, and it costs the game nothing because
# gamescope does the scaling. Use a 16:9 size for a 16:9 panel.
#
#SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS -w 1600 -h 900 -F fsr"
#SCB_PRE_COMMAND='"$HOME/.local/bin/skyrim-configure-display" 1600 900'
#
# ── Ultrawide pillarbox ──
# Vanilla Skyrim SE stretches its HUD and menus at 21:9; rendering a 16:9 image
# and letting gamescope centre it on the wide panel is the mod-free way out, at
# the cost of black bars. The real fix is a widescreen UI mod — see the
# README's phase 2. Passing the 16:9 size to the pre-command also makes it
# derive the vanilla 80 degree FOV rather than the panel's widened one, which
# is what a pillarboxed image wants.
#
#SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS -w 2560 -h 1440 -S fit"
#SCB_PRE_COMMAND='"$HOME/.local/bin/skyrim-configure-display" 2560 1440'
