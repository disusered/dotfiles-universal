# shellcheck shell=bash disable=SC2034
# Skyrim Special Edition (AppID 489830)

# The 60 fps cap that used to live here is gone, and SSE Display Tweaks owns
# the frame rate now.
#
# Skyrim's Havok physics is stepped off the frame rate: above roughly 60 fps
# vanilla produces objects that drift or launch themselves, carts and ladders
# that break, and water that flows at the wrong speed. Every monitor this repo
# serves runs faster than 60, so until phase 2 the cap was a correctness
# requirement rather than a preference — enforced twice, by DXVK
# (dxvk.maxFrameRate) and by gamescope (-r 60).
#
# Display Tweaks decouples the physics step instead of clamping the frame rate,
# which is the actual fix. Confirmed in its own log on the first modded launch
# (2026-08-08):
#
#   [HAVOK] (DYNAMIC) fMaxTime=0.00416667-0.0166667 (Max FPS = 240)
#
# DYNAMIC is the load-bearing word — the physics step is being recomputed per
# frame rather than assumed to be 1/60. Its limiter is configured in
# Data/SKSE/Plugins/SSEDisplayTweaks.ini, so change the frame rate there, not
# here. If Display Tweaks is ever removed, put both caps back before playing.
#
# --force-windows-fullscreen keeps the game's borderless window filling the
# nested surface. Do not add --force-grab-cursor here: gamescope 3.16.x can
# freeze its Wayland backend for seconds while the pointer moves and flood the
# user journal with duplicate-buffer warnings. SSE Display Tweaks owns pointer
# confinement through LockCursor=true instead.
SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS --force-windows-fullscreen"

# A queued benchmark is a persisted matrix row, not a disposable boolean.
# Normal play remains native and uninstrumented. A queued run loads its exact
# prepared profile and cannot launch until the benchmark controller verifies
# the monitor, configuration hashes, game build, generated INI and gamescope
# arguments.
SKYRIM_PERF_STATE="${XDG_STATE_HOME:-$HOME/.local/state}/skyrim-performance"
SKYRIM_BENCHMARK_ARMED="$SKYRIM_PERF_STATE/armed-run"
if [[ -f $SKYRIM_BENCHMARK_ARMED ]]; then
  SKYRIM_BENCHMARK_RUN_ID=$(<"$SKYRIM_BENCHMARK_ARMED")
  SKYRIM_BENCHMARK_ENV="$SKYRIM_PERF_STATE/runs/$SKYRIM_BENCHMARK_RUN_ID/prepared.env"
  if [[ ! -f $SKYRIM_BENCHMARK_ENV ]]; then
    echo "Skyrim benchmark $SKYRIM_BENCHMARK_RUN_ID has no prepared environment" >&2
    exit 1
  fi
  # Generated by skyrim-benchmark from validated profile and matrix values.
  # shellcheck disable=SC1090
  source "$SKYRIM_BENCHMARK_ENV"

  SCB_AUTO_RES=0
  SCB_DEBUG=1
  export MANGOHUD_CONFIGFILE="$HOME/.config/MangoHud/skyrim-benchmark.conf"
  export MANGOHUD_CONFIG="output_folder=$RUN_DIR,output_file=$RUN_DIR/mangohud,custom_text_center=$RUN_ID"

  if [[ ${RUN_KIND:-legacy} == presentation ]]; then
    # Presentation runs replace every ambient ScopeBuddy choice with the
    # prepared profile. This makes the recorded argument string the argument
    # string Gamescope actually receives and keeps version/backend/overlay A/B
    # cells to one changed value.
    : "${GAMESCOPE_MODE:?prepared presentation run has no GAMESCOPE_MODE}"
    : "${OVERLAY_POLICY:?prepared presentation run has no OVERLAY_POLICY}"
    : "${HOST_WORKLOAD_POLICY:?prepared presentation run has no HOST_WORKLOAD_POLICY}"
    export SKYRIM_HOST_WORKLOAD_POLICY=$HOST_WORKLOAD_POLICY

    SCB_AUTO_HDR=0
    SCB_AUTO_VRR=0
    SCB_AUTO_REFRESH=0
    SCB_AUTO_FRAME_LIMIT=0
    SCB_APPENDMODE=0
    SCB_NESTEDFIX=1

    case $GAMESCOPE_MODE in
      enabled)
        : "${GAMESCOPE_BIN:?prepared presentation run has no GAMESCOPE_BIN}"
        : "${GAMESCOPE_BIN_DIR:?prepared presentation run has no GAMESCOPE_BIN_DIR}"
        : "${GAMESCOPE_SCRIPT_PATH:?prepared presentation run has no GAMESCOPE_SCRIPT_PATH}"
        : "${GAMESCOPE_ARGS:?prepared presentation run has no GAMESCOPE_ARGS}"
        [[ -x $GAMESCOPE_BIN ]] || {
          echo "Skyrim benchmark $RUN_ID selected a missing Gamescope binary: $GAMESCOPE_BIN" >&2
          exit 1
        }
        [[ -x $GAMESCOPE_BIN_DIR/gamescopereaper ]] || {
          echo "Skyrim benchmark $RUN_ID has no matching gamescopereaper in $GAMESCOPE_BIN_DIR" >&2
          exit 1
        }
        [[ -d $GAMESCOPE_SCRIPT_PATH ]] || {
          echo "Skyrim benchmark $RUN_ID selected a missing Gamescope script directory: $GAMESCOPE_SCRIPT_PATH" >&2
          exit 1
        }
        SCB_GAMESCOPE_ARGS=$GAMESCOPE_ARGS
        export GAMESCOPE_BIN GAMESCOPE_SCRIPT_PATH
        export PATH="$GAMESCOPE_BIN_DIR:$PATH"
        ;;
      bypass)
        if [[ -n ${GAMESCOPE_BIN:-} || -n ${GAMESCOPE_BIN_DIR:-} ||
              -n ${GAMESCOPE_SCRIPT_PATH:-} || -n ${GAMESCOPE_ARGS:-} ]]; then
          echo "Skyrim benchmark $RUN_ID cannot select Gamescope values in bypass mode" >&2
          exit 1
        fi
        SCB_NOSCOPE=1
        SCB_GAMESCOPE_ARGS=""
        export MANGOHUD=1
        ;;
      *)
        echo "Skyrim benchmark $RUN_ID has invalid Gamescope mode: $GAMESCOPE_MODE" >&2
        exit 1
        ;;
    esac

    case $OVERLAY_POLICY in
      game)
        ;;
      off)
        # Remove only Steam's overlay hooks. Preserve any unrelated preload so
        # overlay-off remains the sole changed field in that matrix cell.
        SKYRIM_PRELOAD_WITHOUT_OVERLAY=""
        SKYRIM_PRELOAD_SEPARATOR=""
        IFS=' :' read -r -a SKYRIM_PRELOAD_PARTS <<< "${LD_PRELOAD:-}"
        for SKYRIM_PRELOAD_PART in "${SKYRIM_PRELOAD_PARTS[@]}"; do
          [[ -n $SKYRIM_PRELOAD_PART ]] || continue
          [[ $SKYRIM_PRELOAD_PART == */gameoverlayrenderer.so ||
             $SKYRIM_PRELOAD_PART == gameoverlayrenderer.so ]] && continue
          SKYRIM_PRELOAD_WITHOUT_OVERLAY+="$SKYRIM_PRELOAD_SEPARATOR$SKYRIM_PRELOAD_PART"
          SKYRIM_PRELOAD_SEPARATOR=:
        done
        export LD_PRELOAD=$SKYRIM_PRELOAD_WITHOUT_OVERLAY
        unset SKYRIM_PRELOAD_PARTS SKYRIM_PRELOAD_PART SKYRIM_PRELOAD_WITHOUT_OVERLAY SKYRIM_PRELOAD_SEPARATOR
        ;;
      *)
        echo "Skyrim benchmark $RUN_ID has invalid overlay policy: $OVERLAY_POLICY" >&2
        exit 1
        ;;
    esac
  else
    # Legacy FPS rows retain their existing resolution-profile construction.
    SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS --mangoapp"
    if [[ $EXPLICIT_NESTED == 1 ]]; then
      SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS -w $GAME_WIDTH -h $GAME_HEIGHT -S $SCALER -F $FILTER"
    fi
    SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS -W $OUTPUT_WIDTH -H $OUTPUT_HEIGHT"
  fi

  "$HOME/.local/bin/skyrim-configure-display" "$GAME_WIDTH" "$GAME_HEIGHT"
  "$HOME/.local/bin/skyrim-benchmark" activate "$RUN_ID" "$SCB_GAMESCOPE_ARGS"
  export SKYRIM_BENCHMARK_RUN_ID
  # shellcheck disable=SC2016
  SCB_POST_COMMAND='"$HOME/.local/bin/skyrim-benchmark" post-launch "$SKYRIM_BENCHMARK_RUN_ID"'
  SCB_PRE_COMMAND=""
else
  # Normal launches regenerate the INIs for the focused monitor. WIDTH and
  # HEIGHT are populated later by ScopeBuddy's SCB_AUTO_RES pass.
  # shellcheck disable=SC2016,SC2034
  SCB_PRE_COMMAND='"$HOME/.local/bin/skyrim-configure-display" "$WIDTH" "$HEIGHT"'
fi
unset SKYRIM_BENCHMARK_ARMED SKYRIM_BENCHMARK_ENV SKYRIM_PERF_STATE
