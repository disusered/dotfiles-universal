# Civ VI crashes while rebuilding its DXGI swap chain after exclusive-fullscreen
# focus changes under Proton. Keep the game borderless at the monitor's detected
# resolution and let gamescope own the actual fullscreen surface.
SCB_GAMESCOPE_ARGS="$SCB_GAMESCOPE_ARGS --force-grab-cursor --force-windows-fullscreen"

# WIDTH and HEIGHT are populated later by ScopeBuddy's SCB_AUTO_RES pass. Keep
# this command single-quoted so they expand when the pre/post hooks execute.
# shellcheck disable=SC2016
SCB_PRE_COMMAND='"$HOME/.local/bin/civ6-configure-display" "$WIDTH" "$HEIGHT"'
# shellcheck disable=SC2034
SCB_POST_COMMAND=$SCB_PRE_COMMAND
