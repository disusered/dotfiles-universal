linux[whoami.distro^="Arch"]:
  installs:
    cmd: |
      set -eu
      if ! pacman -Q python ffmpeg gcc openssl >/dev/null 2>&1; then
        sudo pacman -S --needed --noconfirm python ffmpeg gcc openssl
      fi
      mkdir -p ~/.config/the-deck
      install -d -m0700 ~/.local/state/the-deck
      if [ ! -f ~/.config/the-deck/env ]; then
        install -m0600 ~/.dotfiles/tools/the-deck/env.example ~/.config/the-deck/env
      fi
      ~/.rotz/bin/rotz link /tools/the-deck -f
      systemctl --user daemon-reload
      if ! cmp -s ~/.dotfiles/tools/the-deck/resolved.conf /etc/systemd/resolved.conf.d/70-the-deck.conf; then
        sudo install -Dm0644 ~/.dotfiles/tools/the-deck/resolved.conf /etc/systemd/resolved.conf.d/70-the-deck.conf
        sudo systemctl restart systemd-resolved.service
      fi
      echo 'The Deck service is installed. Run cfg run open from workshop/spikes/the-deck to start it.'
  links:
    systemd/the-deck.service: ~/.config/systemd/user/the-deck.service
