#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Carlos Rosquillas"
email = "crosquillas@gmail.com"

[ui]
color = "auto"
editor = "nvim"
pager = ":builtin"
diff-formatter = ":color-words"
diff-editor = ":builtin"
merge-editor = "nvim"

[git]
colocate = true
sign-on-push = true

[working-copy]
eol-conversion = "input"

[fsmonitor]
backend = "watchman"

[signing]
behavior = "drop"
backend = "ssh"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN0ymLThQeG/B8GhYqrOUdjr2yydERDzP94yU9LT9o+N"
backends.ssh.allowed-signers = "~/.ssh/allowed_signers"

[merge-tools.nvim]
program = "nvim"
merge-args = ["-f", "$output"]
merge-tool-edits-conflict-markers = true
conflict-marker-style = "git"

[template-aliases]
'format_starship(commit, stats)' = '''
separate(
  " ",
  label("jj", "jj"),
  label("change_id", commit.change_id().shortest(4)),
  commit.bookmarks(),
  if(
    stats.total_added() > 0,
    label("diff added", "+" ++ stats.total_added()),
  ),
  if(
    stats.total_removed() > 0,
    label("diff removed", "-" ++ stats.total_removed()),
  ),
  if(commit.conflict(), label("conflict", "conflict")),
  if(commit.divergent(), label("divergent", "divergent")),
  if(commit.empty(), label("empty", "empty")),
)
'''

[colors]
jj = { fg = "#cba6f7", bold = true }
change_id = "#cba6f7"
commit_id = "#f38ba8"
author = "#f9e2af"
timestamp = "#94e2d5"
bookmark = "#cba6f7"
bookmarks = "#cba6f7"
local_bookmarks = "#cba6f7"
remote_bookmarks = "#89b4fa"
tag = "#fab387"
tags = "#fab387"
git_ref = "#a6e3a1"
git_refs = "#a6e3a1"
working_copies = "#a6e3a1"
divergent = "#eba0ac"
"mutable divergent" = { fg = "#f38ba8", bold = true }
conflict = { fg = "#f38ba8", bold = true }
empty = "#a6e3a1"
separator = "#6c7086"
elided = "#6c7086"
rest = "#6c7086"
"node working_copy" = { fg = "#a6e3a1", bold = true }
"node immutable" = { fg = "#74c7ec", bold = true }
"node conflicted" = { fg = "#f38ba8", bold = true }
"diff removed" = { fg = "#f38ba8" }
"diff added" = { fg = "#a6e3a1" }
"diff removed token" = { bg = "#53394d", bold = true, underline = false }
"diff added token" = { bg = "#404f4b", bold = true, underline = false }

# Builtin aliases already cover the short verbs: b, ci, desc, st, op.
# Only genuinely long, genuinely daily commands get an alias here.
[aliases]
f = ["git", "fetch"]
p = ["git", "push"]
pc = ["git", "push", "--change", "@"]
pd = ["git", "push", "--dry-run"]
tug = ["bookmark", "advance", "--to", "@-"]
la = ["log", "-r", "all()"]

[[--scope]]
--when.repositories = ["~/Development/ITERAMIND"]

[--scope.user]
name = "Carlos Rosquillas"
email = "carlos@iteramind.com"
