# Local model routing for the Herding Cats operator deployment. Secrets remain
# in CLIProxyAPI's machine-local state and enter DSH only through apiKeyEnv.
- id: llm-pi-ai
  config:
    providers:
      cliproxyapi:
        displayName: CLIProxyAPI
        apiKeyEnv: CLIPROXYAPI_API_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:8317/v1
        reasoning: xhigh
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            reasoningEfforts:
              xhigh: xhigh

- id: agent-default-model
  config:
    provider: cliproxyapi
    model: gpt-5.6-sol
