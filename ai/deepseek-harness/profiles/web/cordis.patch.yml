# Model routing for the Herding Cats operator deployment. No secret enters this
# file: each route names a credential reference that DSH resolves per request,
# from CLIProxyAPI's machine-local state or the managed credential document.
- id: llm-pi-ai
  config:
    providers:
      cliproxyapi:
        displayName: CLIProxyAPI
        apiKeyEnv: CLIPROXYAPI_API_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:8317/v1
        reasoning: xhigh
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            reasoningEfforts:
              xhigh: xhigh

# DeepSeek's own API. `deepseek-flash` is DeepSeek V4.1 Flash, the current
# canonical id; the catalog replaces the adapter's stale defaults
# (deepseek-v4-flash and deepseek-v4-pro) so the picker advertises what the
# endpoint actually serves. Capacity and output cap keep the adapter defaults.
#
# `inputModalities` is load-bearing, not decorative. Naming `models` replaces
# the adapter's whole built-in catalog, and an entry that omits `image` defaults
# to text-only — which is what makes `read_image` and pasted attachments fail
# with "does not declare image input". The endpoint accepts image parts for this
# model, so this declaration is what switches multimodal input on. It requires
# DSH >= 0.1.5; the 0.1.0 adapter ignores the key and stays text-only, so its
# presence is inert until the runtime is upgraded.
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    reasoningEffort: high
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        inputModalities: [text, image]

# Web search is a separate auxiliary DeepSeek call on the Anthropic-compatible
# Messages endpoint; pin it to the canonical id too.
- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    model: deepseek-flash

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# Pin the in-page folder picker: the adaptive chooser (-auto) resolves to the
# native OS chooser when the host sees a display, which leaves the Web shell's
# workspace dialog unable to list directories.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-browse'
