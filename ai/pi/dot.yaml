linux:
  links:
    themes: ~/.pi/agent/themes
  installs:
    cmd: |
      set -eu
      npm install -g --no-audit --no-fund @earendil-works/pi-coding-agent@1.0.2
      # OptChat is our own reviewed copy; see README for provenance.
      (cd ~/.dotfiles/ai/pi/extensions/optchat && npm ci --ignore-scripts --no-audit --no-fund)
      pi install ~/.dotfiles/ai/pi/extensions/optchat
      # Unlicensed upstream, so installed from git pinned to the reviewed commit.
      pi install git:github.com/aliceisjustplaying/pi-you-should-know@1322e7410e7b3f08bf4bd03ab9728d996c647d0c
      pi install npm:pi-notify@1.4.0
      pi install npm:@bacnh85/pi-checkpoint@0.1.9
      pi mcp add brain-portal --url http://127.0.0.1:1937/v1/mcp
      pi mcp add xbol-knowledge --url http://127.0.0.1:1934/v1/mcp
      pi mcp add iteramind-knowledge --url https://okf.iteramind.dev/mcp
      pi --version
    depends:
      - /languages/javascript/node/latest
