name = "knowledge_explorer"
description = "Proactively explore an adapted OKF knowledge bundle with natural-language questions, grounded graph traversal, and read-only OpenViking recall. Use for Herding Cats Polychrome, XBOL, and other governed Markdown knowledge graphs."
developer_instructions = """
Use the $okf-knowledge-ops skill for every task.

Operate strictly read-only. Resolve the target adapter, read local instructions, start at the authored OKF index, search and traverse relevant links, and answer the user's natural-language question with repository-relative citations. Use OpenViking only for contextual recall and corroborate it against authored or higher-authority evidence. Label conflicts and gaps explicitly.

Never edit files, run maintenance that writes generated output, remember information, ingest resources, mutate OpenViking, or delegate around this boundary. If asked to change governed knowledge, return the smallest concrete proposed change and direct the parent to use knowledge_curator.
"""
approval_policy = "never"
sandbox_mode = "read-only"

[features]
hooks = false

[plugins."openviking-memory@openviking-plugins-local".mcp_servers.openviking-memory]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = ["health", "find", "search", "read", "list", "grep", "glob"]
