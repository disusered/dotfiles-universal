global:
  installs:
    cmd: command -v claude &>/dev/null || curl -fsSL https://claude.ai/install.sh | bash
    depends:
      - /ai/agent-instructions
      - /ai/agent-skills
      - /ai/agents
      - /tools/hyprspace
  links:
    skills: ~/.claude/skills/
    output-styles: ~/.claude/output-styles/
linux|darwin:
  links:
    settings.json: ~/.claude/settings.json
    file-suggestion.sh: ~/.claude/file-suggestion.sh
    claude.lua: {{ dirs.base.config }}/hypr/conf.d/claude.lua
windows:
  links:
    settings_win.json: ~/.claude/settings.json
